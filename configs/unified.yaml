kg_store_path: data/kg_store/

llm:
  provider: mock               # Options: mock | ollama | openai
  model: llama3.2
  base_url: http://localhost:11434
  temperature: 0.3
  max_tokens: 512
  token_budget: 3000

embedding:
  model: sentence-transformers/all-mpnet-base-v2
  dim: 768
  batch_size: 128

partitioning:
  n_partitions: 50
  max_partition_size: 200
  validate_on_cora: true

alignment:
  checkpoint: checkpoints/mlp_encoder.pt
  hidden_dim: 256
  temperature: 0.07
  epochs: 30
  batch_size: 64
  lr: 1e-4

retrieval:
  vector_top_k: 10
  colbert_candidate_k: 50
  colbert_final_k: 5
  bfs_hops: 2
  agent_top_partitions: 3
  agent_prune_threshold: 0.3

colbert:
  model: colbert-ir/colbertv2.0
  device: cpu                  # Switch to cuda if GPU available

evaluation:
  benchmark_csv: benchmark_400.csv
  output_dir: results/
  ground_truth: data/processed/ground_truth.json
  use_ragas: false
