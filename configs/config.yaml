# C-RAG Unified Knowledge Base Configuration
# ------------------------------------------
# Centralized configuration for the entire C-RAG evaluation benchmark.

# Storage Paths
storage:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  ukb_dir: "data/ukb_storage"
  master_nodes: "data/processed/master_nodes.json"
  synthetic_benchmarks: "data/processed/synthetic_benchmark.json"

# RAG Strategy Hyperparameters
retrieval:
  top_k: 5
  graph_hops: 2
  max_context_tokens: 3000
  # Strategy 3 (CRAG Agentic Partitioning) specifics
  vector_top_k: 10
  colbert_candidate_k: 50
  colbert_final_k: 5
  agent_top_partitions: 3
  agent_prune_threshold: 0.3
  
  models:
    encoder: "all-MiniLM-L6-v2"
    generator: "gpt-3.5-turbo" # Can switch to local SLM like 'llama3'
    colbert: "colbert-ir/colbertv2.0"

# Alignment Checkpoints & Config
alignment:
  checkpoint: "checkpoints/text_mlp_encoder.pt"
  hidden_dim: 512
  temperature: 0.07
  epochs: 50
  batch_size: 64
  lr: 1e-4

# Graph Community Partitioner
partitioning:
  target_nodes_per_chunk: 200
  method: "greedy_modularity"

# Evaluation Output
evaluation:
  benchmark_csv: "results/benchmark_results.csv"
  output_dir: "results/"

