# rx project for CRAG on the shared lab host (see results/L1_HOST/HOST_LANE_DECLARATION.json).
# Push = an explicit list of code files plus the declared inputs; never the tree, never git:tracked.
# Environment: mpr's pinned "mpr-cpu" is used read-only by name.  The one env this project owns is [envs.crag-ner] below (2026-09-30 user ruling: a crag-owned spaCy env for the Freebase NER family; never mpr's envs).
